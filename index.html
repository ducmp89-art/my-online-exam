<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Online - Cloud Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .lined-paper { background-color: #fffdf9; background-image: repeating-linear-gradient(transparent, transparent 31px, #e2e8f0 31px, #e2e8f0 32px); line-height: 32px; padding: 8px 16px; }
        .bubble-btn { width: 32px; height: 32px; border-radius: 9999px; border: 2px solid #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #475569; cursor: pointer; }
        .bubble-btn.selected { background-color: #1e40af; border-color: #1e40af; color: #ffffff; }
        .bubble-btn.correct-ans { background-color: #16a34a !important; border-color: #16a34a !important; color: #ffffff !important; }
        .bubble-btn.wrong-ans { background-color: #dc2626 !important; border-color: #dc2626 !important; color: #ffffff !important; }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 h-screen flex flex-col overflow-hidden font-sans">
    <header class="bg-indigo-900 text-white shadow-md z-30 shrink-0">
        <div class="max-w-full mx-auto px-4 py-2.5 flex justify-between items-center">
            <h1 id="header-title" class="text-base font-bold">Đang tải hệ thống...</h1>
            <div class="flex items-center space-x-3">
                <select id="exam-selector" onchange="loadExam(this.value)" class="bg-indigo-900 text-white text-xs font-semibold px-2 py-1 rounded border border-indigo-600">
                    <option value="">Đang tải danh sách...</option>
                </select>
                <span id="timer-display" class="font-mono text-sm font-bold text-amber-300">60:00</span>
                <button onclick="submitExam()" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-4 py-1.5 rounded text-xs text-white">Nộp Bài</button>
            </div>
        </div>
    </header>
    <main class="flex-1 flex overflow-hidden p-2 gap-2">
        <section class="w-1/2 bg-white rounded shadow border p-5 overflow-y-auto" id="exam-paper-content">
            <h3 id="paper-title" class="font-bold text-base text-indigo-950 uppercase">ĐỀ THI</h3>
            <div id="mc-questions-list" class="space-y-4 mt-4"></div>
            <div id="essay-questions-list" class="space-y-4 mt-6"></div>
        </section>
        <section class="w-1/2 bg-amber-50 rounded shadow border p-5 overflow-y-auto">
            <h3 class="font-bold text-amber-950 text-sm uppercase mb-4">PHIẾU LÀM BÀI</h3>
            <div id="answer-matrix-grid" class="space-y-3"></div>
            <div id="essay-answer-sheets" class="space-y-4 mt-4"></div>
        </section>
    </main>
    <script>
        let examData = {};
        let studentAnswers = { mc: {}, essay: {} };
        let isSubmitted = false;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let res = await fetch('exams_index.json');
                let data = await res.json();
                let selector = document.getElementById('exam-selector');
                selector.innerHTML = '';
                data.exams.forEach(ex => {
                    let opt = document.createElement('option');
                    opt.value = ex.path;
                    opt.textContent = ex.title;
                    selector.appendChild(opt);
                });
                if (data.exams.length > 0) loadExam(data.exams[0].path);
            } catch(e) {
                document.getElementById('header-title').innerText = "Lỗi tải danh sách đề thi!";
            }
        });

        async function loadExam(path) {
            let res = await fetch(path);
            examData = await res.json();
            renderExam();
        }

        function renderExam() {
            document.getElementById('header-title').innerText = examData.metadata.testName;
            document.getElementById('paper-title').innerText = examData.metadata.testName;
            
            let mcHtml = '';
            let matrixHtml = '';
            (examData.multipleChoice || []).forEach(q => {
                mcHtml += `<div class="mb-3"><b>Câu ${q.id}:</b> ${q.question}<br>`;
                Object.keys(q.options).forEach(k => mcHtml += `&nbsp;&nbsp;<b>${k}.</b> ${q.options[k]}<br>`);
                mcHtml += `</div>`;

                matrixHtml += `<div class="flex items-center space-x-2"><span class="w-12 text-xs">C${q.id}:</span>`;
                ['A','B','C','D'].forEach(opt => {
                    matrixHtml += `<button onclick="selectMC(${q.id}, '${opt}')" id="b-${q.id}-${opt}" class="bubble-btn">${opt}</button>`;
                });
                matrixHtml += `</div>`;
            });
            document.getElementById('mc-questions-list').innerHTML = mcHtml;
            document.getElementById('answer-matrix-grid').innerHTML = matrixHtml;

            let essayHtml = '';
            let essayAnswerHtml = '';
            (examData.essay || []).forEach(q => {
                essayHtml += `<div class="mb-4"><b>${q.title}</b><br>${q.statement}</div>`;
                essayAnswerHtml += `<div><b>${q.title} - Bài làm:</b><textarea class="lined-paper w-full rounded border mt-1" rows="3" oninput="studentAnswers.essay[${q.id}] = this.value"></textarea></div>`;
            });
            document.getElementById('essay-questions-list').innerHTML = essayHtml;
            document.getElementById('essay-answer-sheets').innerHTML = essayAnswerHtml;

            if (window.MathJax) MathJax.typesetPromise();
        }

        function selectMC(qId, opt) {
            if (isSubmitted) return;
            ['A','B','C','D'].forEach(o => document.getElementById(`b-${qId}-${o}`).classList.remove('selected'));
            document.getElementById(`b-${qId}-${opt}`).classList.add('selected');
            studentAnswers.mc[qId] = opt;
        }

        function submitExam() {
            isSubmitted = true;
            let score = 0;
            (examData.multipleChoice || []).forEach(q => {
                if (studentAnswers.mc[q.id] === q.answer) score += 0.5;
            });
            alert(`Đã nộp bài thành công! Điểm trắc nghiệm: ${score}`);
        }
    </script>
</body>
</html>
